  - url: https://edrys-labs.github.io/module-monaco-editor/
    config:
      editorId: station
      value: |
        // Arduino Nano ESP32: the RGB LED is active LOW
        // (LOW = on, HIGH = off)
        const int leds[] = {LED_RED, LED_GREEN, LED_BLUE};
        const char* names[] = {"red", "green", "blue"};

        void setup() {
          Serial.begin(115200);
          for (int i = 0; i < 3; i++) {
            pinMode(leds[i], OUTPUT);
            digitalWrite(leds[i], HIGH);  // off
          }
        }

        void loop() {
          for (int i = 0; i < 3; i++) {
            digitalWrite(leds[i], LOW);   // on
            Serial.print("Colour: ");
            Serial.println(names[i]);
            delay(700);
            digitalWrite(leds[i], HIGH);  // off
          }
        }
      runCommand: execute
      language: cpp
      theme: auto
      synchronize: true
      readOnly: false
