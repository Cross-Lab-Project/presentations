  - url: https://edrys-labs.github.io/module-markdown-it/index.html
    config:
      content: |-
        # Tasks

        > **Task 1**: Run the starter code. Watch the RGB LED in the camera and the colour names in the terminal. Do they match?

        > **Task 2**: Make the LED blink faster, and add a fourth state in which all three colours are on at the same time. Which colour do you see?

        > **Task 3**: Let the LED send `SOS` in Morse code (`... --- ...`): short = 200 ms, long = 600 ms, pause between letters = 600 ms. Print each letter to the serial monitor.

        > **Conceptual task**: The camera shows the board with a delay. How would you measure the real timing of your blink pattern without trusting the video?

        ## Hardware

        | Component        | Details                                    |
        | ---------------- | ------------------------------------------ |
        | Microcontroller  | Espressif ESP32-S3 (u-blox NORA-W106)      |
        | RGB LED          | `LED_RED`, `LED_GREEN`, `LED_BLUE`, active LOW |
        | Builtin LED      | `LED_BUILTIN` (active HIGH)                 |
        | Connectivity     | Wi-Fi, Bluetooth LE                        |
        | Toolchain        | `arduino-cli`, core `arduino:esp32`        |

        More information: [Arduino Nano ESP32 documentation](https://docs.arduino.cc/hardware/nano-esp32/)
