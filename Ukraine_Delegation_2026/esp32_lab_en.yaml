    config:
      content: |-
        # Welcome to the Arduino Nano ESP32 Remote Lab

        Dear participants,

        this lab gives you direct access to a real microcontroller: an **Arduino Nano ESP32**, connected to a computer in our RoboLab in Freiberg.

        **How it works**

        1. Open the **Station** in the menu on the left.
        2. Edit the C++ code in the editor and press the **run** button.
        3. The station compiles your code and uploads it to the board. This takes about 15 seconds.
        4. Watch the board through the **camera** and read its output in the **terminal**.

        Everything runs in your browser, and there is nothing to install. The station itself is just a browser window and a small Docker container on a laptop.

        > Only one person can program the board at a time. If someone else is working at the station, please wait a moment and watch together.

        _Your CrossLab team, TU Bergakademie Freiberg_
