        # Calliope Mini Lab – Introduction to MicroPython & Sensors

        Dear participants,

        this lab gives you a first hands-on introduction to programming embedded systems with MicroPython, using the Calliope mini as an example.

        The central task is a weather display: you read environmental data from the sensors of the Calliope mini, show it on the LED matrix and detect strong temperature changes. You are welcome to extend the application with your own ideas.

        You can upload your programs from the editor directly to the real device and test them. Please check whether someone else is already working at the station before you upload your code. The last program stays on the device, so please leave the station in a comprehensible state.

        In **Room 1** you get basic information about the Calliope mini and the learning objectives of this lab. In **Room 2** you develop and test your program in a simulator, where you can set temperature and brightness yourself. At the **Station** you then run it on the real Calliope mini.

        > Your code changes at the station are stored **anonymously**. We use them to identify actual difficulties and to improve the course systematically. The data does not allow any conclusions about the participants or their computers.

        We look forward to your feedback and suggestions.

        _Your CrossLab team_
