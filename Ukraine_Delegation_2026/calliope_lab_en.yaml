  - url: https://edrys-labs.github.io/module-markdown-it/index.html
    config:
      content: |-
        # Simulator exercise

        Here you develop the weather display from the main task. The simulator models a Calliope mini 3: LED matrix, buttons and pins work as on the real device. The output of `print()` appears in the terminal below the board.

        You set the environmental data with the sliders below the board: temperature between 0 and 40 °C and brightness between 0 and 255. Press buttons A and B with a mouse click on the board. The program next to this text reads the temperature every second and prints it to the serial interface. Start it with the run button in the editor and change the temperature.

        > **Practical task 1**: Extend the program into a weather display: above 25 °C show a happy face (`Image.HAPPY`), below 15 °C a sad one (`Image.SAD`), and in between a sleeping one (`Image.ASLEEP`).

        > **Practical task 2**: Detect when the temperature changes by more than 2 °C between two measurements. In that case briefly show an arrow in the direction of the change (`Image.ARROW_N` or `Image.ARROW_S`) and print a warning to the serial interface. Test your program by moving the slider quickly and slowly.

        > **Conceptual task 1**: The function `temperature()` returns the temperature of the processor, not of the environment. Think about how this affects your measurements on the real device, and how often a measurement makes sense for a weather display.

        ## Preparing for the remote lab

        Once your weather display works in the simulator, copy the code into the station's editor and run it on the real Calliope mini. There the sensor values cannot be changed and the buttons cannot be pressed. So test all branches of your program here in the simulator, including the extensions from Room 1 (read the brightness with `display.read_light_level()`).
