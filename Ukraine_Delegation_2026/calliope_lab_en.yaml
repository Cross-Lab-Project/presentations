  - url: https://edrys-labs.github.io/module-markdown-it/index.html
    config:
      content: |-
        # Task

        ## Learning objectives

        * First steps in programming embedded systems with MicroPython
        * Getting to know the hardware of the Calliope mini (sensors, LED matrix, buttons)
        * Reading environmental sensors and showing the values on the LED matrix
        * Developing structured, reusable programs in MicroPython
        * Using the serial interface for communication and debugging

        ## Assignment

        > **Main task**: Develop a weather display that measures the temperature regularly, shows it as a symbol on the LED matrix, and detects and indicates strong temperature changes between two measurements.

        You find the individual steps in the simulator exercise in **Room 2**. Once your weather display works, you can extend it, for example:

        * An alarm that shows a warning symbol on the LED matrix when it gets dark.
        * Switching between temperature and brightness display with buttons A and B.
        * Continuous transmission of the measurements over the serial interface, e.g. as a table with time stamps.

        You are also welcome to implement your own ideas and try out further functions of the Calliope mini.

        ## Simulator and station

        In the simulator (**Room 2**) you set temperature and brightness with sliders and press the buttons with a mouse click. This lets you test every branch of your program.

        At the **Station** your program runs on the real Calliope mini, which you watch through the camera. There you cannot change the sensor values: the room temperature is nearly constant, the station light is on while someone is in the room, and the buttons cannot be pressed remotely. So develop and test the logic of your program in the simulator, and check at the station that it runs on the real hardware and delivers plausible values.

        ## Technical basis

        The lab uses the Calliope mini 3.

        | Component          | Function                  |
        | ------------------ | ------------------------- |
        | Nordic nRF52820    | Interface processor       |
        | Nordic nRF52833    | Application processor     |
        | Light sensor       | Environmental data        |
        | Temperature sensor | Environmental data        |
        | LED matrix (5x5)   | Output of information     |
        | RGB LEDs (3x)      | Output of information     |
        | Buttons (2x)       | User interaction          |
        | Bluetooth module   | Communication             |

        More information and technical details on the Calliope mini:

        * [Calliope mini overview](https://calliope.cc/en)
        * [Calliope mini MicroPython API](https://calliope.cc/programmieren/editoren/python/python-api)
