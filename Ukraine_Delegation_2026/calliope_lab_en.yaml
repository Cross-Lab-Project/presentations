  - url: https://edrys-labs.github.io/module-markdown-it/index.html
    config:
      content: |-
        # Getting started with the Calliope mini and MicroPython

        > This station trains your skills in working with embedded systems. You program the Calliope mini with MicroPython to implement basic functions such as reading environmental sensors and output on the LED matrix.

        The Calliope mini 3 is based on a Nordic nRF52833 microcontroller. Sensors and actuators are directly accessible through the MicroPython API.

        The goal is to get familiar with the platform, read sensor values, show them on the LED matrix and implement simple logic.

        ## Remote lab

        > **Practical task 3**: First run the starter code below. It prints the temperature and brightness of the real Calliope mini to the serial interface every second. Compare the values with those you set in the simulator.

        > **Practical task 4**: Run the weather display you developed in the simulator on the station. Check through the camera whether the right symbol appears on the LED matrix.

        > **Conceptual task 2**: Why do the measurements at the station hardly change? How would you test your program on a real device whose environment you cannot influence?

        **Starter code**

        ```python
        from calliopemini import *

        while True:
            print('Temperature:', temperature(), 'Brightness:', display.read_light_level())
            sleep(1000)
        ```
